[project]
name = "abastecimienbot"
version = "0.1.0"
description = "Agente local para analizar precios, proveedores y oportunidades de consolidacion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
abastecimienbot = "procurement_agent.cli:main"
procurement-agent = "procurement_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--basetemp=pytest_tmp", "-p", "no:cacheprovider"]
norecursedirs = [
  "pytest-cache-files-*",
  ".pytest_cache",
  ".pytest-tmp",
  "reports",
  "data",
  "hola_multiagent/reports",
  "hola_multiagent/analysis",
  "hola_multiagent/artifacts",
]
